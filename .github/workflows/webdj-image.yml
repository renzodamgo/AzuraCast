name: Build Web DJ patched image
on:
  workflow_dispatch:
  push:
    branches:
      - fix/webdj-crackling
  schedule:
    - cron: '0 6 * * 1' # Weekly, to follow upstream rolling releases

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream main so the frontend matches the base image
        run: |
          git config user.name ci && git config user.email ci@example.com
          git pull --no-rebase --no-edit https://github.com/AzuraCast/AzuraCast.git main

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.webdj
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/azuracast-webdj:latest
